<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - NEXORA PAY BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #fffbeb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="max-w-md mx-auto bg-amber-50 min-h-screen pb-24 relative shadow-2xl">

    <!-- Header -->
    <div class="bg-yellow-400 px-4 py-4 rounded-b-3xl shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-gray-800 text-xl font-bold">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="text-base font-bold text-gray-800">ডেইলি টাস্ক (Tasks)</h2>
        </div>
        <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-orange-600 shadow">
            <i class="fa-solid fa-briefcase"></i>
        </div>
    </div>

    <!-- Task List Area -->
    <div class="px-4 mt-6 space-y-4">
        <!-- Task Item 1 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-yellow-100 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-video"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm text-gray-800">ভিডিও দেখে আয়</h3>
                    <p class="text-xs text-green-600 font-semibold mt-0.5">রিওয়ার্ড: ৳ ২০.০০</p>
                </div>
            </div>
            <button class="bg-yellow-400 text-gray-900 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-yellow-500">
                শুরু করুন
            </button>
        </div>

        <!-- Task Item 2 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-yellow-100 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-share-nodes"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm text-gray-800">সোশ্যাল মিডিয়া টাস্ক</h3>
                    <p class="text-xs text-green-600 font-semibold mt-0.5">রিওয়ার্ড: ৳ ৫০.০০</p>
                </div>
            </div>
            <button class="bg-yellow-400 text-gray-900 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-yellow-500">
                শুরু করুন
            </button>
        </div>
    </div>

</body>
</html>tasks.html
