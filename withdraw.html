<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Money - NEXORA PAY BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #fffbeb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="max-w-md mx-auto bg-amber-50 min-h-screen pb-20">

    <!-- Top Header -->
    <div class="bg-yellow-400 px-4 pt-4 pb-6 rounded-b-3xl shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-gray-800 text-xl font-bold">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="text-base font-bold text-gray-800">Withdraw Money</h1>
        </div>
        <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center shadow">
            <i class="fa-solid fa-wallet text-yellow-500"></i>
        </div>
    </div>

    <!-- Withdraw Form Area -->
    <div class="px-4 mt-6 space-y-4">
        
        <!-- Balance Card -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-center">
            <p class="text-xs text-gray-500 mb-1">বর্তমান ব্যালেন্স</p>
            <h2 id="currentBalance" class="text-3xl font-extrabold text-red-600">৳ 0.00</h2>
        </div>

        <!-- Withdraw Form -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            
            <!-- Select Method -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">পেমেন্ট মেথড সিলেক্ট করুন</label>
                <select id="paymentMethod" class="w-full p-3 bg-amber-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-yellow-400 font-medium">
                    <option>বিকাশ (Bkash)</option>
                    <option>নগদ (Nagad)</option>
                    <option>রকেট (Rocket)</option>
                </select>
            </div>

            <!-- Account Number -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">একাউন্ট নাম্বার</label>
                <input type="text" id="accountNumber" placeholder="আপনার বিকাশ/নগদ নাম্বার দিন" class="w-full p-3 bg-amber-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-yellow-400">
            </div>

            <!-- Amount -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">টাকার পরিমাণ</label>
                <input type="number" id="withdrawAmount" placeholder="সর্বনিম্ন ১২০ টাকা" class="w-full p-3 bg-amber-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-yellow-400">
            </div>

            <!-- Submit Button with Action -->
            <button onclick="handleWithdraw()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-md transition duration-200">
                রিকোয়েস্ট পাঠান
            </button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around py-2 shadow-lg z-50">
        <a href="index.html" class="flex flex-col items-center text-gray-500">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium">হোম</span>
        </a>
        <a href="tasks.html" class="flex flex-col items-center text-gray-500">
            <i class="fa-solid fa-tasks text-lg"></i>
            <span class="text-[10px] font-medium">টাস্ক</span>
        </a>
        <a href="withdraw.html" class="flex flex-col items-center text-red-600">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span class="text-[10px] font-medium">উইথড্র</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-500">
            <i class="fa-solid fa-share-nodes text-lg"></i>
            <span class="text-[10px] font-medium">রেফার</span>
        </a>
    </div>

<script>
    // Load balance from the global 'balance' key
    let balance = parseFloat(localStorage.getItem('balance')) || 0.00;
    document.getElementById('currentBalance').innerText = '৳ ' + balance.toFixed(2);

    function handleWithdraw() {
        const accNumber = document.getElementById('accountNumber').value;
        const amount = parseFloat(document.getElementById('withdrawAmount').value);

        if (!accNumber || isNaN(amount)) {
            alert('দয়া করে সঠিক একাউন্ট নাম্বার এবং টাকার পরিমাণ লিখুন।');
            return;
        }

        if (amount < 120) {
            alert('সর্বনিম্ন ১২০ টাকা উইথড্র করতে হবে!');
            return;
        }

        if (amount > balance) {
            alert('আপনার একাউন্টে পর্যাপ্ত ব্যালেন্স নেই!');
            return;
        }

        // Deduct balance and update
        balance -= amount;
        localStorage.setItem('balance', balance);
        document.getElementById('currentBalance').innerText = '৳ ' + balance.toFixed(2);

        alert('আপনার উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে!');
        document.getElementById('accountNumber').value = '';
        document.getElementById('withdrawAmount').value = '';
    }
</script>

</body>
</html>
